<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · truedxf</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Served by Cloudflare Pages with status 404 for every unknown path (vite.config.ts). -->
    <style>
      :root {
        --bg: #0f1419;
        --panel: #161b22;
        --border: #2a323d;
        --text: #e6edf3;
        --muted: #8b96a3;
        --accent: #2f81f7;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #eef1f4;
          --panel: #ffffff;
          --border: #d8dee4;
          --text: #1f2328;
          --muted: #59636e;
          --accent: #0969da;
          color-scheme: light;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px / 1.5 "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
      }
      main {
        max-width: 420px;
        padding: 28px 28px 24px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        text-align: center;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      a {
        display: inline-block;
        padding: 7px 14px;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There is nothing at this address. The DXF viewer is on the start page.</p>
      <a href="/">Open the DXF viewer</a>
    </main>
  </body>
</html>
