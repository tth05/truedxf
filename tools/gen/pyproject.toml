[project]
name = "truedxf-gen"
version = "0.1"
description = "truedxf test-fixture generator (ezdxf)"
requires-python = ">=3.11"
dependencies = ["ezdxf==1.4.4", "pillow"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["truedxf_gen", "truedxf_gen.suites"]
